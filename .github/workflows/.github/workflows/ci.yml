name: DocVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - uses: actions/checkout@v4

    # 2. Setup .NET (Backend)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    # 3. Build Backend (This verifies your C# code compiles)
    - name: Build .NET API
      run: dotnet build --configuration Release

    # 4. Setup Node.js (Frontend)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    # 5. Build Frontend (This verifies your Angular code compiles)
    # Note: We will add 'npm ci' and 'npm run build' later when you actually push the Angular code.
    # For now, this placeholder is enough to register the check in GitHub.
    - name: Placeholder Frontend Check
      run: echo "Angular app not yet committed, skipping build."
