<div class="container-fluid bg-light min-vh-100 py-4 px-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-primary mb-0">DocVault</h3>
  </div>

  <!-- Search + Upload -->
  <div class="row g-3 align-items-center mb-4">
    <div class="col-md-8">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-end-0"> 🔍 </span>
        <input
          type="text"
          class="form-control border-start-0"
          placeholder="Search documents..."
          [(ngModel)]="searchTerm"
          (input)="search()"
        />
      </div>
    </div>

    <div class="col-md-4 text-md-end">
      <input type="file" #fileInput hidden (change)="onFileSelected($event); upload()" />
      <button class="btn btn-primary px-4 shadow-sm" (click)="fileInput.click()">+ Upload</button>
    </div>
  </div>

  <!-- Alert Message -->
  <div
    *ngIf="message"
    class="alert shadow-sm"
    [ngClass]="message.includes('✅') ? 'alert-success' : 'alert-danger'"
  >
    {{ message }}
  </div>

  <!-- Table Card -->
  <div class="card border-0 shadow-lg">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-uppercase small">
            <tr>
              <th class="text-center">Name</th>
              <th class="text-center">Date</th>
              <th class="text-center">Size</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let doc of documents">
              <td>
                <div class="d-flex align-items-center">
                  <div class="bg-light rounded p-2 me-3 border">📄</div>
                  <span class="fw-medium">{{ doc.fileName }}</span>
                </div>
              </td>

              <td>
                {{ doc.uploadedAt | date: 'MMM dd, yyyy' }}
              </td>

              <td>{{ doc.sizeBytes / 1024 | number: '1.0-1' }} KB</td>

              <td class="text-end">
                <button class="btn btn-outline-primary btn-sm" (click)="download(doc.id)">
                  ↓ SAS
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="documents.length === 0" class="text-center text-muted py-5">
        No documents found. Start by uploading a file.
      </div>
    </div>
  </div>
</div>
